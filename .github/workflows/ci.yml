name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/gramix tests
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test installed wheel in a clean environment
        run: |
          python -m venv /tmp/gramix-wheel
          /tmp/gramix-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/gramix-wheel/bin/python -m unittest discover -s tests -v
          /tmp/gramix-wheel/bin/python -c "from importlib.resources import files; import gramix; assert files('gramix').joinpath('py.typed').is_file(); print(gramix.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
