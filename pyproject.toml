[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gramix-api"
dynamic = ["version"]
description = "Python client for the Gramix reseller API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gramix.io" }]
keywords = ["gramix", "telegram", "api", "sdk"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://gramix.io/resellers/api"
Documentation = "https://gramix.io/resellers/api/documentation"
Repository = "https://github.com/gramix-io/gramix-python-sdk"
Issues = "https://github.com/gramix-io/gramix-python-sdk/issues"
Changelog = "https://github.com/gramix-io/gramix-python-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.5,<2",
    "mypy>=2.3,<3",
    "twine>=7,<8",
    "ruff>=0.11,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gramix = ["py.typed"]

[tool.mypy]
strict = true

[tool.setuptools.dynamic]
version = {attr = "gramix._version.__version__"}

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
